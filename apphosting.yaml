# apphosting.yaml
runConfig:
  minInstances: 1
  maxInstances: 10
  memoryPerInstanceMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCzNrbw-Y3-_KWU1t9TxgSpe6r0Y3GjD6A"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "belivavip.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "belivavip"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "belivavip.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "325544509262"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:325544509262:web:3627cd2adda7cdcbc4281f"
    availability: [BUILD, RUNTIME]
  # Само на runtime, не и в build — този токен се чете само в Server Component/Server Action
  # (admin-beliva-2025/page.tsx, actions/auth.ts), никога не стига до client bundle-а.
  # ВАЖНО: самото добавяне на това линийка не е достатъчно — трябва реалната тайна стойност да се съхрани в
  # Google Secret Manager първо (виж инструкциите в чата).
  - variable: ADMIN_SESSION_TOKEN
    secret: ADMIN_SESSION_TOKEN
    availability: [RUNTIME]
  # Използва се в /api/ai-format-tour за GPT-4o — също така липсваше от apphosting.yaml, оттам 500 грешките при
  # всеки опит за сканиране в продукция — заявката към OpenAI тръгваше с "Bearer undefined" и биваше
  # отхвърлена. Това е плащен, чувствителен API ключ — задължително през Secret Manager, никога като
  # plaintext в този файл (който се качва в git).
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability: [RUNTIME]

  # ─── GA4 / OpenAI Usage ─── вече зададени и работещи като Secret Manager тайни.
  #
  # ВАЖНО за бъдещи тайни тук: Firebase App Hosting ИЗИСКВА всяка реферирана тук тайна да СЪЩЕСТВУВА реално в
  # Secret Manager, иначе ЦЕЛИЯт deployment гръмва с "Misconfigured secret" и нищо не стига до продукция —
  # НЕ грациозно показва "Не е конфигурирано" като admin панела, а спира целия rollout. Затова
  # META_ACCESS_TOKEN/META_AD_ACCOUNT_ID са махнати оттук — добавяй ги обратно тук САМО след като реално са зададени
  # чрез `firebase apphosting:secrets:set` (когато пуснеш Meta реклами).
  - variable: GA4_PROPERTY_ID
    secret: GA4_PROPERTY_ID
    availability: [RUNTIME]
  - variable: GA4_CLIENT_EMAIL
    secret: GA4_CLIENT_EMAIL
    availability: [RUNTIME]
  - variable: GA4_PRIVATE_KEY
    secret: GA4_PRIVATE_KEY
    availability: [RUNTIME]
  - variable: OPENAI_ADMIN_KEY
    secret: OPENAI_ADMIN_KEY
    availability: [RUNTIME]